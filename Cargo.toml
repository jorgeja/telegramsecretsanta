[package]
name = "secret_santa"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.34"
pretty_env_logger = "0.5.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "ctrlc_handler", "rustls"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }
